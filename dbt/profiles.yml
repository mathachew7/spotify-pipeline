wavelength:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_DATASET', 'spotify_warehouse') }}"
      location: US
      keyfile: /root/.dbt/keys/service_account.json
      threads: 4
      timeout_seconds: 300
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_DATASET', 'spotify_warehouse') }}"
      location: US
      keyfile: /root/.dbt/keys/service_account.json
      threads: 8
      timeout_seconds: 600
