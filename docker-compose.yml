version: '3.8'

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    # Spotify credentials — set in .env file (see .env.example)
    SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
    SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
    SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN}
    # GCP
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/keys/service_account.json
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GCS_BUCKET: ${GCS_BUCKET}
    BQ_DATASET: ${BQ_DATASET:-spotify_warehouse}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./loaders:/opt/airflow/loaders
    - ./keys:/opt/airflow/keys
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - wavelength

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'airflow']
      interval: 5s
      retries: 5
    networks:
      - wavelength

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
        airflow db upgrade &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "
    restart: 'no'

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ['CMD', 'airflow', 'jobs', 'check', '--job-type', 'SchedulerJob', '--hostname', 'airflow-scheduler']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # dbt — runs on-demand via docker exec or Airflow BashOperator
  dbt:
    image: ghcr.io/dbt-labs/dbt-bigquery:1.8.0
    volumes:
      - ./dbt:/usr/app/dbt
      - ./keys:/root/.dbt/keys
    working_dir: /usr/app/dbt
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      BQ_DATASET: ${BQ_DATASET:-spotify_warehouse}
    networks:
      - wavelength
    profiles:
      - dbt

volumes:
  postgres-data:
  airflow-logs:

networks:
  wavelength:
    driver: bridge
